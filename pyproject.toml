[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-switch-ui"
version = "0.6.1"
description = "CC Switch Web UI —— Claude Code / Codex 多供应商管理面板"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "cliecy"},
]
keywords = [
    "claude-code",
    "claude",
    "anthropic",
    "deepseek",
    "kimi",
    "glm",
    "qwen",
    "openrouter",
    "web-ui",
    "management",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Utilities",
]
dependencies = [
    "flask>=3.1",
]

[project.scripts]
cc-switch-ui = "cc_switch_ui.app:main"
cc-switch = "cc_switch_ui.cli:main"

[project.urls]
Homepage = "https://github.com/cliecy/cc-switch-ui"
Issues = "https://github.com/cliecy/cc-switch-ui/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_switch_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cc_switch_ui/**/*.py",
    "src/cc_switch_ui/index.html",
    "src/cc_switch_ui/static/**",
    "index.html",
    "tests/**/*.py",
    "README.md",
    "run.sh",
    "LICENSE",
]

[tool.ruff]
# 最小门禁：只拦「会真出事」的错误级问题（语法错误 / 未定义名）。
# 存量风格问题不在此治理，避免一次性大改；后续可渐进收紧。
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E9",   # 语法级错误
  "F63",  # 无效比较
  "F7",   # 语法级 assert 位置错误
  "F82",  # 未定义名
  "F821", # 未知名称引用
]
